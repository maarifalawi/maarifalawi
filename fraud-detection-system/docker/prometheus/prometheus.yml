global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "rules/*.yml"

scrape_configs:
  - job_name: "fraud-detection-api"
    metrics_path: "/api/v1/metrics/prometheus"
    static_configs:
      - targets: ["fraud-api:8000"]
        labels:
          service: "fraud-detection"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
